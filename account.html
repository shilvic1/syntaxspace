<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - SyntaxSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017" />
  </head>
  <body class="bg-black text-gray-200 font-sans">
    <!-- Navbar -->
    <!-- Navbar -->
<nav class="bg-gray-900 px-6 py-4 shadow-md">
  <div class="flex justify-between items-center">
    <!-- Logo -->
    <div class="flex items-center">
      <a href="/" class="flex items-center">
        <img
          src="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017"
          alt="SyntaxSpace Logo"
          class="h-10 w-10 mr-3"
        />
        <span class="text-2xl font-bold text-cyan-400">SyntaxSpace</span>
      </a>
    </div>

    <!-- Desktop Menu -->
    <div class="hidden md:flex space-x-6 items-center">
      <ul class="flex space-x-6">
        <li><a class="hover:text-cyan-400" href="/">Home</a></li>
        <li><a class="hover:text-cyan-400" href="/projects.html">Projects</a></li>
        <li><a class="hover:text-cyan-400" href="/tutorials.html">Tutorials</a></li>
        <li><a class="hover:text-cyan-400" href="/community.html">Community</a></li>
        <li><a class="hover:text-cyan-400" href="/challenges.html">Challenges</a></li>
      </ul>
      <!-- Account Button -->
      <a
        href="/account.html"
        class="text-cyan-400 border border-cyan-400 px-4 py-2 rounded-full hover:bg-cyan-400 hover:text-black"
      >
        Account
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="md:hidden text-gray-400 focus:outline-none" id="menu-btn">
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <ul class="hidden md:hidden mt-4 space-y-4" id="mobile-menu">
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/">Home</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/projects.html">Projects</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/tutorials.html">Tutorials</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/community.html">Community</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/challenges.html">Challenges</a></li>
    <li><a class="block text-cyan-400 border border-cyan-400 px-4 py-2 rounded-full hover:bg-cyan-400 hover:text-black" href="/account.html">Account</a></li>
  </ul>
</nav>

<script>
  // Toggle Mobile Menu
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>


    <!-- Account Details -->
    <div class="flex justify-center items-center h-screen">
      <div
        class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md text-center"
      >
        <h1 class="text-3xl font-bold text-cyan-400 mb-6">
          Welcome to Your Account
        </h1>
        <div id="account-info" class="text-gray-300">
          <!-- Account details will be populated here -->
        </div>
        <button
          id="logout-btn"
          class="mt-6 bg-cyan-400 text-black font-bold p-3 rounded-lg hover:bg-cyan-500"
        >
          Logout
        </button>
      </div>
    </div>

    <script>
      const accountInfo = document.getElementById("account-info");
      const logoutBtn = document.getElementById("logout-btn");

      const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

      if (!loggedInUser) {
        window.location.href = "/login.html";
      } else {
        accountInfo.innerHTML = `
        <p><strong>Name:</strong> ${loggedInUser.name}</p>
        <p><strong>Email:</strong> ${loggedInUser.email}</p>
      `;
      }

      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("loggedInUser");
        alert("You have been logged out!");
        window.location.href = "/";
      });
    </script>
  </body>
</html>
