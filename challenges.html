<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body class="bg-black text-gray-200 font-sans">

<!-- Navbar -->
<nav class="bg-gray-900 px-6 py-4 shadow-md">
  <div class="flex justify-between items-center">
    <!-- Logo -->
    <div class="flex items-center">
      <a href="/" class="flex items-center">
        <img
          src="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017"
          alt="SyntaxSpace Logo"
          class="h-10 w-10 mr-3"
        />
        <span class="text-2xl font-bold text-cyan-400">SyntaxSpace</span>
      </a>
    </div>

    <!-- Desktop Menu -->
    <div class="hidden md:flex space-x-6 items-center">
      <ul class="flex space-x-6">
        <li><a class="hover:text-cyan-400" href="/">Home</a></li>
        <li><a class="hover:text-cyan-400" href="/projects.html">Projects</a></li>
        <li><a class="hover:text-cyan-400" href="/tutorials.html">Tutorials</a></li>
        <li><a class="hover:text-cyan-400" href="/community.html">Community</a></li>
        <li><a class="hover:text-cyan-400" href="/challenges.html">Challenges</a></li>
      </ul>
      <!-- Account Button -->
      <a
        href="/account.html"
        class="text-cyan-400 border border-cyan-400 px-4 py-2 rounded-full hover:bg-cyan-400 hover:text-black"
      >
        Account
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="md:hidden text-gray-400 focus:outline-none" id="menu-btn">
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <ul class="hidden md:hidden mt-4 space-y-4" id="mobile-menu">
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/">Home</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/projects.html">Projects</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/tutorials.html">Tutorials</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/community.html">Community</a></li>
    <li><a class="block text-gray-300 hover:text-cyan-400" href="/challenges.html">Challenges</a></li>
    <li><a class="block text-cyan-400 border border-cyan-400 px-4 py-2 rounded-full hover:bg-cyan-400 hover:text-black" href="/account.html">Account</a></li>
  </ul>
</nav>

<script>
  // Toggle Mobile Menu
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>

  <!-- Main Content -->
  <div class="container mx-auto mt-12 px-6">
    <h1 class="text-4xl font-bold text-cyan-400 text-center">Challenges & Leaderboard</h1>

    <!-- Leaderboard Section -->
    <section class="mt-8">
      <h2 class="text-2xl font-bold text-gray-300">Leaderboard</h2>
      <ul id="leaderboard" class="mt-4 bg-gray-800 p-6 rounded-lg shadow-lg">
        <!-- Leaderboard dynamically populated by JavaScript -->
      </ul>
    </section>

    <!-- Available Challenges -->
    <section class="mt-12">
      <h2 class="text-2xl font-bold text-gray-300">Available Challenges</h2>
      <ul id="challenges-list" class="mt-4 bg-gray-800 p-6 rounded-lg shadow-lg">
        <!-- Challenges dynamically populated by JavaScript -->
      </ul>
    </section>
  </div>

  <!-- Footer -->
  <footer class="mt-12 bg-gray-900 p-4 text-center">
    <p class="text-gray-400">&copy; 2025 SyntaxSpace. All Rights Reserved.</p>
  </footer>

  <script>
    // Sample Data
    const users = [
      { username: 'User1', points: 50 },
      { username: 'User2', points: 30 },
      { username: 'User3', points: 10 },
    ];

    const challenges = [
      { id: 1, title: 'Complete the HTML Basics Tutorial', points: 10 },
      { id: 2, title: 'Complete the JavaScript Basics Tutorial', points: 20 },
      { id: 3, title: 'Complete the Advanced CSS Tutorial', points: 30 },
    ];

    // Current user (this would be dynamically set in a real application)
    let currentUser = { username: 'CurrentUser', points: 0 };

    // Populate Leaderboard
    const leaderboard = document.getElementById('leaderboard');
    function updateLeaderboard() {
      leaderboard.innerHTML = users
        .sort((a, b) => b.points - a.points)
        .map(user => `<li>${user.username}: ${user.points} points</li>`)
        .join('');
    }
    updateLeaderboard();

    // Populate Challenges List
    const challengesList = document.getElementById('challenges-list');
    challengesList.innerHTML = challenges
      .map(
        challenge =>
          `<li class="flex justify-between items-center mt-2">
            <span>${challenge.title}</span>
            <button
              class="bg-cyan-400 text-black px-4 py-2 rounded-full hover:bg-cyan-500"
              onclick="completeChallenge(${challenge.id})"
            >
              Complete
            </button>
          </li>`
      )
      .join('');

    // Complete Challenge Function
    function completeChallenge(challengeId) {
      const challenge = challenges.find(c => c.id === challengeId);
      if (challenge) {
        currentUser.points += challenge.points;
        users.push(currentUser); // Update user points
        updateLeaderboard();
        alert(
          `Challenge "${challenge.title}" completed! You've earned ${challenge.points} points.`
        );
      }
    }
  </script>
</body>
</html>
