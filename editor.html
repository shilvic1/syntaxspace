<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Editor | SyntaxSpace</title>
    <link
      rel="icon"
      href="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/material.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/monokai.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/eclipse.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/ambiance.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/ayu-mirage.min.css"
    />
    <style>
      /* Layout Adjustments to match Image */
      #sidebar {
        width: 260px;
        flex-shrink: 0;
        background-color: #181818; /* Darker sidebar like VS Code */
        border-right: 1px solid #333;
      }

      .CodeMirror {
        height: 100%;
        font-size: 14px; /* Standard IDE font size */
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      }

      /* Theme Styles */
      .theme-dark {
        --bg-color: #0d0d0d;
        --text-color: #cccccc;
        --editor-bg: #1e1e1e;
        --sidebar-bg: #181818;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow: hidden;
      }

      /* File Tree Styling */
      .file-item {
        padding: 4px 12px;
        font-size: 13px;
        display: flex;
        align-items: center;
        cursor: pointer;
        transition: background 0.2s;
        color: #969696;
      }

      .file-item:hover {
        background-color: #2a2d2e;
      }

      .file-selected {
        background-color: #37373d !important;
        color: white !important;
      }

      /* Breadcrumbs bar */
      .breadcrumbs {
        background-color: #1e1e1e;
        color: #888;
        font-size: 12px;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #2b2b2b;
      }

      .breadcrumb-item::after {
        content: ">";
        margin: 0 8px;
        color: #555;
      }

      .breadcrumb-item:last-child::after {
        content: "";
      }

      /* UI Controls */
      input, select {
        border: 1px solid #3c3c3c !important;
        outline: none;
      }

      #code-editor .CodeMirror {
        background-color: var(--editor-bg) !important;
      }

      .sidebar-header {
        text-transform: uppercase;
        font-size: 11px;
        font-weight: bold;
        padding: 10px 12px;
        color: #bbb;
      }
    </style>
  </head>
  <body class="theme-dark">
    <nav class="bg-[#181818] px-4 py-2 border-bottom border-[#333] flex justify-between items-center h-12">
      <div class="flex items-center">
        <a href="/" class="flex items-center">
          <img src="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017" alt="Logo" class="h-6 w-6 mr-2" />
          <span class="text-sm font-semibold text-gray-300">SyntaxSpace</span>
        </a>
      </div>
      <div class="flex items-center space-x-3">
        <select id="theme-selector" class="bg-[#252526] text-xs text-gray-300 px-2 py-1 rounded">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="matrix">Matrix</option>
          <option value="future-blue">Future Blue</option>
        </select>
        <button id="back-to-projects" class="text-xs bg-gray-700 text-white px-3 py-1 rounded hover:bg-gray-600">
          Projects
        </button>
      </div>
    </nav>

    <div class="flex h-[calc(100vh-48px)]">
      <aside id="sidebar" class="flex flex-col">
        <div class="sidebar-header">Explorer</div>
        
        <div class="px-3 pb-3 space-y-2">
            <button id="create-file-btn" class="bg-cyan-600 text-white text-xs w-full py-1.5 rounded hover:bg-cyan-700 transition">
              New File +
            </button>
            <input type="text" id="file-search" class="w-full text-xs p-1.5 rounded bg-[#252526] text-gray-300 border-none" placeholder="Search..." />
            <select id="file-filter" class="w-full text-xs p-1 rounded bg-[#252526] text-gray-300 border-none">
                <option value="">All Files</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JS</option>
            </select>
        </div>

        <ul id="file-tree" class="overflow-y-auto flex-1"></ul>
      </aside>

      <main class="flex-1 flex flex-col bg-[#1e1e1e]">
        <div class="breadcrumbs">
            <span class="breadcrumb-item">syntax-space</span>
            <span class="breadcrumb-item">app</span>
            <span class="breadcrumb-item" id="breadcrumb-filename">index.html</span>
        </div>

        <div class="hidden">
            <h2 id="current-file-name">Untitled</h2>
        </div>

        <div id="code-editor" class="flex-1"></div>

        <div class="bg-[#1e1e1e] p-2 flex justify-end border-t border-[#2b2b2b]">
          <button id="save-btn" class="bg-[#0e639c] text-white text-xs px-4 py-1 hover:bg-[#1177bb]">
            Save
          </button>
        </div>
      </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/css/css.min.js"></script>
    <script>
      // ALL YOUR EXISTING LOGIC REMAINS BELOW
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = ".html, .css, .js";
      fileInput.style.display = "none";
      document.body.appendChild(fileInput);

      const importFileBtn = document.createElement("button");
      importFileBtn.id = "import-file-btn";
      importFileBtn.textContent = "Import File";
      importFileBtn.className = "fixed bottom-4 left-4 bg-green-700 hover:bg-green-800 text-white text-xs py-1.5 px-3 rounded shadow-lg transition z-50";
      document.body.appendChild(importFileBtn);

      importFileBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) readFile(file);
      });

      function readFile(file) {
        if (!file.name.endsWith(".html") && !file.name.endsWith(".css") && !file.name.endsWith(".js")) {
          alert("Only .html, .css, and .js files are supported.");
          return;
        }
        const reader = new FileReader();
        reader.onload = function (e) {
          const content = e.target.result;
          project.files[file.name] = content;
          localStorage.setItem("projects", JSON.stringify(projects));
          selectFile(file.name);
          renderFileTree();
        };
        reader.readAsText(file);
      }

      const projectId = new URLSearchParams(window.location.search).get("projectId");
      const projects = JSON.parse(localStorage.getItem("projects")) || [];
      const project = projects.find((p) => p.id === projectId);

      if (!project) {
        alert("Project not found!");
        window.location.href = "/projects.html";
      }

      if (!project.files) {
        project.files = {
          "index.html": "<h1>My First Heading</h1>\n<p>My first paragraph.</p>",
          "styles.css": "/* Add your styles here */",
          "script.js": "// Add your JavaScript here",
        };
        localStorage.setItem("projects", JSON.stringify(projects));
      }

      const fileTree = document.getElementById("file-tree");
      const fileSearch = document.getElementById("file-search");
      const fileFilter = document.getElementById("file-filter");
      const currentFileName = document.getElementById("current-file-name");
      const saveBtn = document.getElementById("save-btn");
      const createFileBtn = document.getElementById("create-file-btn");
      const themeSelector = document.getElementById("theme-selector");
      const backToProjectsBtn = document.getElementById("back-to-projects");

      let selectedFile = Object.keys(project.files)[0];

      const searchBar = document.createElement("div");
      searchBar.id = "search-bar";
      searchBar.className = "hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 p-3 rounded shadow-md w-1/3 z-50";
      searchBar.innerHTML = `<input type="text" id="search-input" class="w-full p-2 rounded bg-gray-700 text-gray-200 placeholder-gray-400">`;
      document.body.appendChild(searchBar);

      const editor = CodeMirror(document.getElementById("code-editor"), {
        value: project.files[selectedFile] || "",
        mode: "javascript",
        theme: "material",
        lineNumbers: true,
        lineWrapping: true,
      });

      const savedTheme = localStorage.getItem("theme") || "dark";
      applyTheme(savedTheme);

      themeSelector.addEventListener("change", (e) => {
        const theme = e.target.value;
        applyTheme(theme);
        localStorage.setItem("theme", theme);
      });

      function applyTheme(theme) {
        document.body.className = `theme-${theme}`;
        themeSelector.value = theme;
        switch (theme) {
          case "light": editor.setOption("theme", "eclipse"); break;
          case "matrix": editor.setOption("theme", "ayu-mirage"); break;
          case "future-blue": editor.setOption("theme", "ambiance"); break;
          default: editor.setOption("theme", "material"); break;
        }
      }

      function renderFileTree() {
        fileTree.innerHTML = "";
        const filter = fileFilter.value;
        Object.keys(project.files)
          .filter((fileName) => fileName.toLowerCase().includes(fileSearch.value.toLowerCase()))
          .filter((fileName) => !filter ? true : fileName.endsWith(`.${filter}`))
          .forEach((fileName) => {
            const li = document.createElement("li");
            li.className = "file-item";
            if (fileName === selectedFile) li.classList.add("file-selected");

            const fileNameSpan = document.createElement("span");
            fileNameSpan.textContent = fileName;
            fileNameSpan.className = "flex-1";

            const actions = document.createElement("div");
            actions.className = "flex space-x-2 opacity-0 hover:opacity-100 transition";

            const renameBtn = document.createElement("button");
            renameBtn.textContent = "✏️";
            renameBtn.onclick = (e) => { e.stopPropagation(); renameFile(fileName); };

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "🗑️";
            deleteBtn.onclick = (e) => { e.stopPropagation(); deleteFile(fileName); };

            actions.appendChild(renameBtn);
            actions.appendChild(deleteBtn);
            li.appendChild(fileNameSpan);
            li.appendChild(actions);
            li.onclick = () => selectFile(fileName);
            fileTree.appendChild(li);
          });
      }

      function selectFile(fileName) {
        selectedFile = fileName;
        editor.setValue(project.files[fileName]);
        currentFileName.textContent = fileName;
        document.getElementById("breadcrumb-filename").textContent = fileName;
        renderFileTree();
      }

      function renameFile(fileName) {
        const newName = prompt("Enter the new name:", fileName);
        if (newName && newName !== fileName) {
          project.files[newName] = project.files[fileName];
          delete project.files[fileName];
          localStorage.setItem("projects", JSON.stringify(projects));
          renderFileTree();
        }
      }

      function deleteFile(fileName) {
        if (confirm(`Are you sure you want to delete "${fileName}"?`)) {
          delete project.files[fileName];
          localStorage.setItem("projects", JSON.stringify(projects));
          renderFileTree();
        }
      }

      fileSearch.addEventListener("input", renderFileTree);
      fileFilter.addEventListener("change", renderFileTree);

      createFileBtn.onclick = () => {
        const newFileName = prompt("Enter the new file name:");
        if (newFileName && !project.files[newFileName]) {
          project.files[newFileName] = "";
          localStorage.setItem("projects", JSON.stringify(projects));
          renderFileTree();
        }
      };

      saveBtn.onclick = () => {
        project.files[selectedFile] = editor.getValue();
        localStorage.setItem("projects", JSON.stringify(projects));
        alert("File saved successfully!");
      };

      backToProjectsBtn.onclick = () => {
        window.location.href = "/projects.html";
      };

      const previewBtn = document.createElement("button");
      previewBtn.id = "preview-btn";
      previewBtn.textContent = "Preview";
      previewBtn.className = "fixed bottom-4 right-4 bg-blue-600 hover:bg-blue-700 text-white text-xs py-1.5 px-4 rounded shadow-lg transition z-50";
      document.body.appendChild(previewBtn);

      previewBtn.addEventListener("click", () => {
        const newTab = window.open("about:blank", "_blank");
        if (newTab) {
          const doc = newTab.document;
          const htmlContent = project.files["index.html"] || "";
          const cssContent = `<style>${project.files["styles.css"] || ""}</style>`;
          const jsContent = `<script>${project.files["script.js"] || ""}<\/script>`;
          doc.write(`<!DOCTYPE html><html><head>${cssContent}</head><body>${htmlContent}${jsContent}</body></html>`);
          doc.close();
        } else {
          alert("Popup blocked!");
        }
      });

      // Keyboard Shortcuts
      document.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey) {
          switch (event.key.toLowerCase()) {
            case "s":
              event.preventDefault();
              project.files[selectedFile] = editor.getValue();
              localStorage.setItem("projects", JSON.stringify(projects));
              alert("Saved!");
              break;
            case "f":
              event.preventDefault();
              fileSearch.focus();
              break;
            case "z":
              if (event.shiftKey) editor.redo(); else editor.undo();
              break;
            case "y":
              event.preventDefault();
              editor.redo();
              break;
          }
        }
        if (event.altKey) {
          if (event.key.toLowerCase() === "arrowup") { event.preventDefault(); switchFile(-1); }
          if (event.key.toLowerCase() === "arrowdown") { event.preventDefault(); switchFile(1); }
        }
      });

      function switchFile(direction) {
        const fileNames = Object.keys(project.files);
        let currentIndex = fileNames.indexOf(selectedFile);
        currentIndex = (currentIndex + direction + fileNames.length) % fileNames.length;
        selectFile(fileNames[currentIndex]);
      }

      renderFileTree();
      selectFile(selectedFile);
    </script>
  </body>
</html>
