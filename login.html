<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SyntaxSpace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017" />
</head>
<body class="bg-black text-gray-200 font-sans">

  <!-- Navbar -->
  <nav class="bg-gray-900 px-6 py-4 shadow-md">
    <div class="flex justify-between items-center">
      <a href="/" class="flex items-center">
        <img
          src="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017"
          alt="SyntaxSpace Logo"
          class="h-10 w-10 mr-3"
        />
        <span class="text-2xl font-bold text-cyan-400">SyntaxSpace</span>
      </a>
      <div class="hidden md:flex space-x-6 items-center">
        <ul class="flex space-x-6">
          <li><a class="hover:text-cyan-400" href="/">Home</a></li>
          <li><a class="hover:text-cyan-400" href="/projects.html">Projects</a></li>
          <li><a class="hover:text-cyan-400" href="/tutorials.html">Tutorials</a></li>
          <li><a class="hover:text-cyan-400" href="/community.html">Community</a></li>
          <li><a class="hover:text-cyan-400" href="/challenges.html">Challenges</a></li>
        </ul>
        <div class="flex space-x-4">
          <a
            href="/login.html"
            class="text-cyan-400 border border-cyan-400 px-4 py-2 rounded-full hover:bg-cyan-400 hover:text-black"
          >
            Login
          </a>
          <a
            href="/signup.html"
            class="bg-cyan-400 text-black px-4 py-2 rounded-full hover:bg-cyan-500"
          >
            Signup
          </a>
        </div>
      </div>
      <button class="md:hidden text-gray-400 focus:outline-none" id="menu-btn">
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>
    </div>
    <ul class="hidden md:hidden mt-4 space-y-4" id="mobile-menu">
      <li><a class="block text-gray-300 hover:text-cyan-400" href="/">Home</a></li>
      <li><a class="block text-gray-300 hover:text-cyan-400" href="/editor.html">Editor</a></li>
      <li><a class="block text-gray-300 hover:text-cyan-400" href="/tutorials.html">Tutorials</a></li>
      <li><a class="block text-gray-300 hover:text-cyan-400" href="/community.html">Community</a></li>
      <li><a class="block text-gray-300 hover:text-cyan-400" href="/challenges.html">Challenges</a></li>
      <li><a class="block text-cyan-400 border border-cyan-400 px-4 py-2 rounded-full hover:bg-cyan-400 hover:text-black" href="/login.html">Login</a></li>
      <li><a class="block bg-cyan-400 text-black px-4 py-2 rounded-full hover:bg-cyan-500" href="/signup.html">Signup</a></li>
    </ul>
  </nav>

  <script>
    const menuBtn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");

    menuBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
  </script>

  <!-- Login Form -->
  <div class="flex justify-center items-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
      <h1 class="text-3xl font-bold text-cyan-400 mb-6 text-center">Login to Your Account</h1>
      <form id="login-form" class="space-y-6">
        <div>
          <label for="email" class="block text-gray-300">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="w-full p-3 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-cyan-400"
            placeholder="Your Email Address"
            required
          />
        </div>
        <div>
          <label for="password" class="block text-gray-300">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="w-full p-3 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-cyan-400"
            placeholder="Your Password"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-cyan-400 text-black font-bold p-3 rounded-lg hover:bg-cyan-500"
        >
          Login
        </button>
      </form>
      <p class="text-gray-400 mt-4 text-center">
        Don't have an account? <a href="/signup.html" class="text-cyan-400 hover:underline">Signup</a>
      </p>
    </div>
  </div>

  <script>
    // Handle form submission
    const form = document.getElementById("login-form");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Save credentials to localStorage
      const userData = JSON.parse(localStorage.getItem("users")) || [];
      const userExists = userData.find((user) => user.email === email && user.password === password);

      if (userExists) {
        alert("Login successful!");
        localStorage.setItem("loggedInUser", JSON.stringify(userExists));
        window.location.href = "/account.html"; // Redirect to the account page
      } else {
        alert("Invalid credentials! Please try again.");
      }
    });
  </script>

</body>
</html>
