<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | SyntaxSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017" />
    <style>
      .dragging {
        opacity: 0.5;
      }
    </style>
  </head>
  <body class="bg-black text-gray-200 font-sans">
    <!-- Navbar -->
    <nav class="bg-gray-900 px-6 py-4 shadow-md">
      <div class="flex justify-between items-center">
        <a href="/" class="flex items-center">
          <img
            src="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017"
            alt="SyntaxSpace Logo"
            class="h-10 w-10 mr-3"
          />
          <span class="text-2xl font-bold text-cyan-400">SyntaxSpace</span>
        </a>
        <ul class="hidden md:flex space-x-6">
          <li><a class="hover:text-cyan-400" href="/">Home</a></li>
          <li>
            <a class="hover:text-cyan-400" href="/projects.html">Projects</a>
          </li>
          <li>
            <a class="hover:text-cyan-400" href="/tutorials.html">Tutorials</a>
          </li>
          <li>
            <a class="hover:text-cyan-400" href="/community.html">Community</a>
          </li>
          <li>
            <a class="hover:text-cyan-400" href="/challenges.html"
              >Challenges</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <!-- Hero Section -->
    <div class="bg-gray-900 py-12 text-center">
      <h1 class="text-4xl font-bold text-cyan-400">Your Projects</h1>
      <p class="mt-4 text-gray-300">
        Create, search, and manage your coding projects.
      </p>
    </div>

    <!-- Search and Filter Section -->
    <section class="mt-6 px-6">
      <div class="relative">
        <input
          id="search-bar"
          type="text"
          class="w-full bg-gray-800 text-gray-200 px-4 py-2 rounded"
          placeholder="Search projects..."
        />
        <select
          id="category-filter"
          class="mt-4 w-full bg-gray-800 text-gray-200 px-4 py-2 rounded"
        >
          <option value="">All Categories</option>
          <option value="web">Web</option>
          <option value="mobile">Mobile</option>
          <option value="ai">AI</option>
        </select>
        <div class="flex justify-end mt-4">
          <button
            id="create-project-btn"
            class="bg-cyan-400 text-black px-6 py-3 rounded-full hover:bg-cyan-500"
          >
            Create+
          </button>
        </div>
      </div>
    </section>

    <!-- Projects List Section -->
    <section class="mt-6 px-6">
      <div id="projects-list" class="space-y-6">
        <!-- Projects will be dynamically loaded here -->
      </div>
      <div id="delete-selected-container" class="hidden mt-6">
        <button
          id="delete-selected-btn"
          class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
        >
          Delete Selected
        </button>
      </div>
    </section>

    <!-- Create Project Popup -->
    <div
      id="create-project-popup"
      class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden"
    >
      <div class="bg-gray-800 p-6 rounded shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-cyan-400 mb-4">Create Project</h2>
        <form id="create-project-form">
          <div class="mb-4">
            <label class="block text-gray-300 mb-1">Project Name</label>
            <input
              type="text"
              id="project-name"
              class="w-full bg-gray-700 text-gray-200 px-4 py-2 rounded"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-gray-300 mb-1">Description</label>
            <textarea
              id="project-description"
              class="w-full bg-gray-700 text-gray-200 px-4 py-2 rounded"
              rows="3"
              required
            ></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-gray-300 mb-1">Category</label>
            <input
              type="text"
              id="project-category"
              class="w-full bg-gray-700 text-gray-200 px-4 py-2 rounded"
            />
          </div>
          <div class="mb-4">
            <label class="block text-gray-300 mb-1">Deadline</label>
            <input
              type="date"
              id="project-deadline"
              class="w-full bg-gray-700 text-gray-200 px-4 py-2 rounded"
            />
          </div>
          <div class="flex justify-end">
            <button
              type="button"
              id="cancel-create"
              class="text-gray-300 px-4 py-2 rounded hover:text-gray-400 mr-2"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="bg-cyan-400 text-black px-4 py-2 rounded hover:bg-cyan-500"
            >
              Create
            </button>
          </div>
        </form>
      </div>
    </div>

    <footer class="mt-12 bg-gray-900 p-4 text-center">
      <p class="text-gray-400">&copy; 2025 SyntaxSpace. All Rights Reserved.</p>
    </footer>

    <script>
      const projectsList = document.getElementById("projects-list");
      const createProjectBtn = document.getElementById("create-project-btn");
      const createProjectPopup = document.getElementById(
        "create-project-popup"
      );
      const cancelCreateBtn = document.getElementById("cancel-create");
      const createProjectForm = document.getElementById("create-project-form");
      const deleteSelectedContainer = document.getElementById(
        "delete-selected-container"
      );
      const deleteSelectedBtn = document.getElementById("delete-selected-btn");

      let projects = JSON.parse(localStorage.getItem("projects")) || [];
      let selectedProjects = new Set();

      function saveProjects() {
        localStorage.setItem("projects", JSON.stringify(projects));
      }

      function renderProjects() {
        projectsList.innerHTML = "";
        selectedProjects.clear();
        deleteSelectedContainer.classList.add("hidden");

        projects.forEach((project, index) => {
          const isOverdue =
            project.deadline && new Date(project.deadline) < new Date();
          const projectId = project.id || generateUniqueId();
          project.id = projectId;

          const projectCard = document.createElement("div");
          projectCard.className = `bg-gray-800 p-4 rounded-lg shadow-md ${
            isOverdue ? "border-2 border-red-500" : ""
          } hover:shadow-lg flex flex-col cursor-pointer`;
          projectCard.draggable = true;
          projectCard.dataset.index = index;

          projectCard.innerHTML = `
            <div class="flex justify-between items-start">
              <input
                type="checkbox"
                class="select-project"
                data-index="${index}"
              />
              <h3 class="text-xl font-bold text-cyan-400">
                ${project.name}
              </h3>
            </div>
            <p class="text-gray-300 mt-2">${project.description}</p>
            ${
              project.deadline
                ? `<p class="text-sm text-gray-400 mt-2">Deadline: ${project.deadline}</p>`
                : ""
            }
            <div class="flex justify-end space-x-2 mt-4">
              <button
                class="bg-gray-700 text-white px-3 py-2 rounded rename-btn"
                data-index="${index}"
              >
                Rename
              </button>
              <button
                class="bg-red-500 text-white px-3 py-2 rounded delete-btn"
                data-index="${index}"
              >
                Delete
              </button>
            </div>
          `;

          projectCard.addEventListener("click", () => {
            window.location.href = `/editor.html?projectId=${projectId}`;
          });

          projectsList.appendChild(projectCard);

          projectCard.addEventListener("dragstart", (e) => {
            projectCard.classList.add("dragging");
            e.dataTransfer.setData("text/plain", index);
          });

          projectCard.addEventListener("dragend", () => {
            projectCard.classList.remove("dragging");
          });
        });

        addEventListenersToProjects();
      }

      function addDragAndDropListeners() {
        projectsList.addEventListener("dragover", (e) => {
          e.preventDefault();
          const draggingCard = document.querySelector(".dragging");
          const afterElement = getDragAfterElement(projectsList, e.clientY);
          if (afterElement) {
            projectsList.insertBefore(draggingCard, afterElement);
          } else {
            projectsList.appendChild(draggingCard);
          }
        });

        projectsList.addEventListener("drop", () => {
          const newOrder = Array.from(projectsList.children).map((card) =>
            parseInt(card.dataset.index, 10)
          );
          projects = newOrder.map((i) => projects[i]);
          saveProjects();
          renderProjects();
        });
      }

      function getDragAfterElement(container, y) {
        const draggableElements = [
          ...container.querySelectorAll("div:not(.dragging)"),
        ];

        return draggableElements.reduce(
          (closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
              return { offset, element: child };
            } else {
              return closest;
            }
          },
          { offset: Number.NEGATIVE_INFINITY }
        ).element;
      }

      function generateUniqueId() {
        return "_" + Math.random().toString(36).substr(2, 9);
      }

      function openCreatePopup() {
        createProjectPopup.classList.remove("hidden");
      }

      function closeCreatePopup() {
        createProjectPopup.classList.add("hidden");
      }

      function addEventListenersToProjects() {
        const renameButtons = projectsList.querySelectorAll(".rename-btn");
        const deleteButtons = projectsList.querySelectorAll(".delete-btn");
        const checkboxes = projectsList.querySelectorAll(".select-project");

        renameButtons.forEach((button) => {
          button.addEventListener("click", (e) => {
            e.stopPropagation();
            const index = button.dataset.index;
            const newName = prompt("Enter new name:", projects[index].name);
            if (newName) {
              projects[index].name = newName;
              saveProjects();
              renderProjects();
            }
          });
        });

        deleteButtons.forEach((button) => {
          button.addEventListener("click", (e) => {
            e.stopPropagation();
            const index = button.dataset.index;
            projects.splice(index, 1);
            saveProjects();
            renderProjects();
          });
        });

        checkboxes.forEach((checkbox) => {
          checkbox.addEventListener("change", (e) => {
            e.stopPropagation();
            const index = checkbox.dataset.index;
            if (checkbox.checked) {
              selectedProjects.add(index);
            } else {
              selectedProjects.delete(index);
            }
            deleteSelectedContainer.classList.toggle(
              "hidden",
              selectedProjects.size === 0
            );
          });
        });
      }

      createProjectBtn.addEventListener("click", openCreatePopup);
      cancelCreateBtn.addEventListener("click", closeCreatePopup);

      createProjectForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("project-name").value;
        const description = document.getElementById(
          "project-description"
        ).value;
        const category = document.getElementById("project-category").value;
        const deadline = document.getElementById("project-deadline").value;

        if (name && description) {
          const newProject = {
            name,
            description,
            category,
            deadline,
            id: generateUniqueId(),
          };
          projects.push(newProject);
          saveProjects();
          renderProjects();
          closeCreatePopup();
          createProjectForm.reset();
        }
      });

      deleteSelectedBtn.addEventListener("click", () => {
        projects = projects.filter(
          (_, index) => !selectedProjects.has(index.toString())
        );
        saveProjects();
        renderProjects();
      });

      renderProjects();
      addDragAndDropListeners();
    </script>
  </body>
</html>
