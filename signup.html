<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - SyntaxSpace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017" />
</head>
<body class="bg-black text-gray-200 font-sans">

  <!-- Navbar -->
  <nav class="bg-gray-900 px-6 py-4 shadow-md">
    <div class="flex justify-between items-center">
      <a href="/" class="flex items-center">
        <img
          src="https://cdn.glitch.global/a69e27d8-d825-4498-80bc-bb07dc33e04f/Syntax%20Space.png?v=1737503683017"
          alt="SyntaxSpace Logo"
          class="h-10 w-10 mr-3"
        />
        <span class="text-2xl font-bold text-cyan-400">SyntaxSpace</span>
      </a>
      <div class="hidden md:flex space-x-6 items-center">
        <ul class="flex space-x-6">
          <li><a class="hover:text-cyan-400" href="/">Home</a></li>
          <li><a class="hover:text-cyan-400" href="/projects.html">Projects</a></li>
          <li><a class="hover:text-cyan-400" href="/tutorials.html">Tutorials</a></li>
          <li><a class="hover:text-cyan-400" href="/community.html">Community</a></li>
          <li><a class="hover:text-cyan-400" href="/challenges.html">Challenges</a></li>
        </ul>
        <div class="flex space-x-4">
          <a href="/login.html" class="text-cyan-400 border border-cyan-400 px-4 py-2 rounded-full hover:bg-cyan-400 hover:text-black">Login</a>
          <a href="/signup.html" class="bg-cyan-400 text-black px-4 py-2 rounded-full hover:bg-cyan-500">Signup</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Signup Form -->
  <div class="flex justify-center items-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
      <h1 class="text-3xl font-bold text-cyan-400 mb-6 text-center">Create an Account</h1>
      <form id="signup-form" class="space-y-6">
        <div>
          <label for="name" class="block text-gray-300">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="w-full p-3 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-cyan-400"
            placeholder="Your Name"
            required
          />
        </div>
        <div>
          <label for="email" class="block text-gray-300">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="w-full p-3 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-cyan-400"
            placeholder="Your Email Address"
            required
          />
        </div>
        <div>
          <label for="password" class="block text-gray-300">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="w-full p-3 rounded-lg bg-gray-700 text-gray-200 focus:ring-2 focus:ring-cyan-400"
            placeholder="Choose a Password"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-cyan-400 text-black font-bold p-3 rounded-lg hover:bg-cyan-500"
        >
          Signup
        </button>
      </form>
      <p class="text-gray-400 mt-4 text-center">
        Already have an account? <a href="/login.html" class="text-cyan-400 hover:underline">Login</a>
      </p>
    </div>
  </div>

  <script>
    const signupForm = document.getElementById("signup-form");

    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const users = JSON.parse(localStorage.getItem("users")) || [];

      // Check if email already exists
      if (users.some((user) => user.email === email)) {
        alert("Email is already registered!");
        return;
      }

      // Save user to localStorage
      users.push({ name, email, password });
      localStorage.setItem("users", JSON.stringify(users));
      alert("Signup successful!");
      window.location.href = "/login.html";
    });
  </script>

</body>
</html>
